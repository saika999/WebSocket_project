<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lesson_59 Websocket</title>
        <link rel="stylesheet" href="./css/main.css">
    </head>
    <body>
        <header class="header">
            <div class="container">
                <div class="wrapper">
                    <h1 class="header__title">Websocket
                    </h1>
                    <p class="status" id="status">Connecting...</p>
                </div>
            </div>
        </header>
        <main class="main">
            <div class="container">
                <div class="inpt-text">
                    <div class="messages" id="messages">
                        <input type="text" id="input"
                            placeholder="Type a message...">
                        <button id="btn-send">Send
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <script src="./js/main.js"></script>
    </body>

</html>
