<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lesson_59 Websocket</title>
        <link rel="stylesheet" href="./css/main.css">
    </head>
    <body>
        <header class="header">
            <div class="container">
                <div class="wrapper">
                    <h1 class="header__title">Websocket
                    </h1>
                    <div class="header__account">
                        <p class="status" id="status">Подключение...</p>
                        <span id="current-user" hidden></span>
                        <button id="btn-logout" type="button"
                            hidden>Выйти</button>
                    </div>
                </div>
            </div>
        </header>
        <main class="main">
            <div class="container">
                <section class="auth-panel" id="auth-panel">
                    <h2>Вход в чат</h2>
                    <form id="auth-form">
                        <label for="username">Имя пользователя</label>
                        <input id="username" name="username" type="text"
                            minlength="3" maxlength="24" autocomplete="username"
                            required>
                        <label for="password">Пароль</label>
                        <input id="password" name="password" type="password"
                            minlength="6" maxlength="88"
                            autocomplete="current-password" required>
                        <div class="auth-actions">
                            <button type="submit" id="btn-sign-in"
                                data-auth-action="login">Войти</button>
                            <button type="button"
                                id="btn-register">Зарегистрироваться</button>
                        </div>
                        <p class="auth-error" id="auth-error" role="alert"></p>
                    </form></section>
                <section class="chat-panel" id="chat-panel" hidden>
                    <div class="messages" id="messages"></div>
                    <div class="inpt-text">
                        <input type="text" id="input"
                            placeholder="Type a message...">
                        <button id="btn-send">Send
                        </button>
                    </div>
                </section>
            </div>
        </main>

        <script src="./js/main.js"></script>
    </body>

</html>
